---
version: '3'

tasks:
  default:
    desc: Run unit tests then the e2e suite
    cmds:
      - task: unit
      - task: e2e

  install-deps:
    desc: Install the Python test dependencies with PDM (tests/pyproject.toml)
    cmds:
      - pdm install --quiet --project tests

  unit:
    desc: Run Go unit tests (pure logic lives next to the packages, see tests/README.md)
    cmds:
      - go vet ./...
      - go test -race -count=1 ./...

  e2e:
    desc: Run the pytest end-to-end suite against the kind cluster (expects `task k8s:up k8s:deploy`)
    deps: [install-deps]
    cmds:
      - pdm run -p tests pytest tests/specs/e2e {{.CLI_ARGS}}

  conformance:
    desc: Run the Gateway API Core conformance profiles (docs/spec/overview.md, docs/spec/acceptance.md criteria 1, 14, 15)
    vars:
      NODE_ARCH:
        sh: kubectl --context {{.KIND_CONTEXT}} get nodes -o jsonpath='{.items[0].status.nodeInfo.architecture}'
    cmds:
      - mkdir -p tests/results/conformance
      - kubectl --context {{.KIND_CONTEXT}} apply -f tests/config/conformance/gatewayclass.yaml
      # The conformance suite dials the addresses published on Gateway
      # status, which are cluster-internal, so the compiled test binary runs
      # inside a pod (it picks up the in-cluster config and its manifests are
      # embedded in the binary).
      - >-
        cd tests/specs/conformance &&
        CGO_ENABLED=0 GOOS=linux GOARCH={{.NODE_ARCH}}
        go test -c -o ../../results/conformance/conformance.test .
      - kubectl --context {{.KIND_CONTEXT}} apply -f tests/config/conformance/runner.yaml
      - kubectl --context {{.KIND_CONTEXT}} -n krouter-conformance wait --for=condition=Ready --timeout=120s pod/conformance-runner
      - kubectl --context {{.KIND_CONTEXT}} -n krouter-conformance cp tests/results/conformance/conformance.test conformance-runner:/work/conformance.test
      - defer: kubectl --context {{.KIND_CONTEXT}} delete -f tests/config/conformance/runner.yaml --ignore-not-found
      - defer: kubectl --context {{.KIND_CONTEXT}} -n krouter-conformance cp conformance-runner:/work/report.yaml tests/results/conformance/report.yaml
      # The raw `go test -v` stream is kept so tests:report can convert it
      # to JUnit with test2json.
      - >-
        set -o pipefail;
        kubectl --context {{.KIND_CONTEXT}} -n krouter-conformance exec conformance-runner --
        /work/conformance.test -test.v -test.timeout 120m -test.run TestConformance
        -gateway-class=krouter
        -organization=link-society
        -project=krouter
        -url=https://github.com/link-society/krouter
        -version=dev
        -contact=https://github.com/link-society/krouter/issues
        -report-output=/work/report.yaml
        {{.CLI_ARGS}}
        | tee tests/results/conformance/output.log

  performance:
    desc: Run the 10,000 concurrent-connection release gate (docs/spec/performance.md, docs/spec/acceptance.md criterion 10)
    deps: [install-deps]
    cmds:
      - pdm run -p tests pytest tests/specs/performance -m performance {{.CLI_ARGS}}

  all:
    desc: Run unit, e2e, conformance and performance suites
    cmds:
      - task: unit
      - task: e2e
      - task: conformance
      - task: performance

  report:
    desc: Run every suite and produce a combined JUnit + HTML report (tests/results/report)
    deps: [install-deps]
    cmds:
      - mkdir -p tests/results/unit tests/results/e2e tests/results/conformance tests/results/performance tests/results/report
      - go vet ./...
      # Suites keep going on failure: the final report step recomputes the
      # overall verdict from the JUnit files and sets the exit code.
      - cmd: go run gotest.tools/gotestsum@{{.GOTESTSUM_VERSION}} --junitfile tests/results/unit/junit.xml -- -race -count=1 ./...
        ignore_error: true
      - cmd: task tests:e2e -- --junitxml=tests/results/e2e/junit.xml
        ignore_error: true
      - cmd: task tests:conformance
        ignore_error: true
      - cmd: task tests:performance -- --junitxml=tests/results/performance/junit.xml
        ignore_error: true
      # Convert the captured conformance `go test -v` stream to JUnit.
      - cmd: go tool test2json -p conformance < tests/results/conformance/output.log > tests/results/conformance/events.json
        ignore_error: true
      - cmd: go run gotest.tools/gotestsum@{{.GOTESTSUM_VERSION}} --junitfile tests/results/conformance/junit.xml --raw-command -- cat tests/results/conformance/events.json
        ignore_error: true
      - pdm run -p tests python tests/src/report/build.py

  bench:
    desc: 'Benchmark one implementation (usage: task tests:bench -- krouter|nginx|traefik)'
    deps: [install-deps]
    cmds:
      - pdm run -p tests python tests/src/benchmark/run.py {{.CLI_ARGS | default "krouter"}}

  bench:all:
    desc: Benchmark krouter, NGINX Gateway Fabric and Traefik side by side (docs/spec/performance.md, docs/spec/acceptance.md criterion 11)
    deps: [install-deps]
    cmds:
      - pdm run -p tests python tests/src/benchmark/run.py krouter nginx traefik

  clean:
    desc: Remove generated test artifacts and the virtualenv
    cmds:
      - rm -rf tests/.venv tests/.pdm-python tests/results
