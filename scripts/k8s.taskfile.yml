---
version: '3'

tasks:
  up:
    desc: Create the kind test cluster and install Gateway API {{.GATEWAY_API_VERSION}} CRDs
    vars:
      CLUSTER_CONFIG_CHECKSUM:
        sh: openssl dgst -sha256 tests/config/kind/cluster.yaml | awk '{print $NF}'
    status:
      - kind get clusters 2>/dev/null | grep -qx '{{.KIND_CLUSTER}}'
      - >-
        test "$(kubectl --context {{.KIND_CONTEXT}} -n kube-system
        get configmap krouter-kind-config -o jsonpath='{.data.checksum}' 2>/dev/null)"
        = "{{.CLUSTER_CONFIG_CHECKSUM}}"
    cmds:
      # The cluster picks up tests/config/kind/cluster.yaml at creation time
      # only, and clusters persist across runs (notably on the self-hosted
      # runner): recreate whenever the config changed since. The checksum of
      # the config that built the cluster lives in-cluster.
      - kind delete cluster --name {{.KIND_CLUSTER}}
      - >-
        kind create cluster
        --name {{.KIND_CLUSTER}}
        --config tests/config/kind/cluster.yaml
        {{if .KIND_NODE_IMAGE}}--image {{.KIND_NODE_IMAGE}}{{end}}
      - >-
        kubectl --context {{.KIND_CONTEXT}} -n kube-system
        create configmap krouter-kind-config
        --from-literal=checksum={{.CLUSTER_CONFIG_CHECKSUM}}
      - task: crds:install

  crds:install:
    desc: Install the Gateway API Experimental channel CRDs — the Standard set plus TCPRoute and TLSRoute (spec requires them pre-installed, docs/spec/overview.md, docs/spec/deployment.md)
    cmds:
      # Server-side apply: the experimental CRDs exceed the client-side
      # last-applied-configuration annotation size limit.
      - kubectl --context {{.KIND_CONTEXT}} apply --server-side --force-conflicts -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{.GATEWAY_API_VERSION}}/experimental-install.yaml
      - kubectl --context {{.KIND_CONTEXT}} wait --for=condition=Established --timeout=60s crd/gatewayclasses.gateway.networking.k8s.io crd/gateways.gateway.networking.k8s.io crd/httproutes.gateway.networking.k8s.io crd/referencegrants.gateway.networking.k8s.io crd/tcproutes.gateway.networking.k8s.io crd/tlsroutes.gateway.networking.k8s.io

  image:update:
    desc: Build the krouter image and load it into the kind cluster
    deps: [':docker:build']
    cmds:
      - task: image:load

  image:load:
    desc: Load the already-built krouter image into the kind cluster (no rebuild)
    cmds:
      - kind load docker-image {{.IMAGE}} --name {{.KIND_CLUSTER}}

  down:
    desc: Delete the kind test cluster
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER}}

  apply:
    desc: Apply the krouter manifest and wait for both planes to roll out
    cmds:
      - kubectl --context {{.KIND_CONTEXT}} apply -f k8s/krouter.yaml
      - kubectl --context {{.KIND_CONTEXT}} -n krouter-system rollout status deployment/krouter-controlplane --timeout=180s
      - kubectl --context {{.KIND_CONTEXT}} -n krouter-system rollout status daemonset/krouter-dataplane --timeout=180s

  deploy:
    desc: Deploy krouter (static manifest, docs/spec/deployment.md) into the kind cluster
    deps: ['image:update']
    cmds:
      - task: apply

  restart:
    desc: Restart the krouter control plane and data plane (pick up a freshly loaded image)
    cmds:
      - kubectl --context {{.KIND_CONTEXT}} -n krouter-system rollout restart deployment/krouter-controlplane daemonset/krouter-dataplane
      - kubectl --context {{.KIND_CONTEXT}} -n krouter-system rollout status deployment/krouter-controlplane --timeout=180s
      - kubectl --context {{.KIND_CONTEXT}} -n krouter-system rollout status daemonset/krouter-dataplane --timeout=180s

  serve:
    desc: Deploy the demo topology (tests/config/mocks/manifest.yml) and port-forward the dashboard to http://localhost:8080
    deps: [':mocks:load']
    cmds:
      - kubectl --context {{.KIND_CONTEXT}} apply -f tests/config/mocks/manifest.yml
      - kubectl --context {{.KIND_CONTEXT}} -n demo rollout status deployment --timeout=180s
      - kubectl --context {{.KIND_CONTEXT}} -n demo-backends rollout status deployment --timeout=180s
      - kubectl --context {{.KIND_CONTEXT}} -n krouter-system port-forward svc/krouter-dashboard 8080:8080
