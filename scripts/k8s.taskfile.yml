---
version: '3'

tasks:
  up:
    desc: Create the kind test cluster and install Gateway API {{.GATEWAY_API_VERSION}} CRDs
    status:
      - kind get clusters 2>/dev/null | grep -qx '{{.KIND_CLUSTER}}'
    cmds:
      - >-
        kind create cluster
        --name {{.KIND_CLUSTER}}
        --config tests/config/kind/cluster.yaml
        {{if .KIND_NODE_IMAGE}}--image {{.KIND_NODE_IMAGE}}{{end}}
      - task: install-gateway-api

  install-gateway-api:
    desc: Install the Gateway API Standard channel CRDs plus the Experimental TCPRoute CRD (spec requires them pre-installed, docs/spec/overview.md, docs/spec/deployment.md)
    cmds:
      - kubectl --context {{.KIND_CONTEXT}} apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{.GATEWAY_API_VERSION}}/standard-install.yaml
      - kubectl --context {{.KIND_CONTEXT}} apply -f https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{.GATEWAY_API_VERSION}}/config/crd/experimental/gateway.networking.k8s.io_tcproutes.yaml
      - kubectl --context {{.KIND_CONTEXT}} wait --for=condition=Established --timeout=60s crd/gatewayclasses.gateway.networking.k8s.io crd/gateways.gateway.networking.k8s.io crd/httproutes.gateway.networking.k8s.io crd/referencegrants.gateway.networking.k8s.io crd/tcproutes.gateway.networking.k8s.io

  load-image:
    desc: Build the krouter image and load it into the kind cluster
    deps: [':docker:build']
    cmds:
      - kind load docker-image {{.IMAGE}} --name {{.KIND_CLUSTER}}

  down:
    desc: Delete the kind test cluster
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER}}

  deploy:
    desc: Deploy krouter (static manifest, docs/spec/deployment.md) into the kind cluster
    deps: [load-image]
    cmds:
      - kubectl --context {{.KIND_CONTEXT}} apply -f k8s/
      - kubectl --context {{.KIND_CONTEXT}} -n krouter-system rollout status deployment/krouter-controlplane --timeout=180s
      - kubectl --context {{.KIND_CONTEXT}} -n krouter-system rollout status daemonset/krouter-dataplane --timeout=180s
