---
# Demo topology for the control-plane dashboard: one Gateway serving all
# three route kinds (HTTP, TCP, TLS passthrough), a same-namespace backend,
# an authorized cross-namespace backend and one intentionally missing
# backend to show degraded rendering.
apiVersion: v1
kind: Namespace
metadata:
  name: dashboard-demo
---
apiVersion: v1
kind: Namespace
metadata:
  name: dashboard-demo-backends
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: dashboard-demo
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: dashboard-demo
spec:
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: dashboard-demo
spec:
  selector:
    app: vault
  ports:
    - name: https
      port: 8200
      targetPort: 8200
---
apiVersion: v1
kind: Service
metadata:
  name: audit
  namespace: dashboard-demo-backends
spec:
  selector:
    app: audit
  ports:
    - name: http
      port: 9100
      targetPort: 9100
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-demo-routes
  namespace: dashboard-demo-backends
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: dashboard-demo
  to:
    - group: ""
      kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo
  namespace: dashboard-demo
spec:
  gatewayClassName: krouter
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: postgres
      protocol: TCP
      port: 5432
      allowedRoutes:
        namespaces:
          from: Same
    - name: vault
      protocol: TLS
      port: 8443
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: dashboard-demo
spec:
  parentRefs:
    - name: demo
  hostnames:
    - demo.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audit
  namespace: dashboard-demo
spec:
  parentRefs:
    - name: demo
  hostnames:
    - demo.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /audit
      backendRefs:
        - name: audit
          namespace: dashboard-demo-backends
          port: 9100
        - name: missing
          port: 9000
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: db
  namespace: dashboard-demo
spec:
  parentRefs:
    - name: demo
      sectionName: postgres
  rules:
    - backendRefs:
        - name: db
          port: 5432
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: vault
  namespace: dashboard-demo
spec:
  parentRefs:
    - name: demo
      sectionName: vault
  hostnames:
    - vault.demo.example.com
  rules:
    - backendRefs:
        - name: vault
          port: 8200
