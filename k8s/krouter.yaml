---
apiVersion: v1
kind: Namespace
metadata:
  name: krouter-system
  labels:
    app.kubernetes.io/name: krouter
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krouter-controlplane
  namespace: krouter-system
  labels:
    app.kubernetes.io/name: krouter
    app.kubernetes.io/component: controlplane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krouter-dataplane
  namespace: krouter-system
  labels:
    app.kubernetes.io/name: krouter
    app.kubernetes.io/component: dataplane
---
# Control-plane permissions (docs/spec/security.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: krouter-controlplane
  labels:
    app.kubernetes.io/name: krouter
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways", "httproutes", "grpcroutes", "tcproutes", "tlsroutes", "udproutes", "backendtlspolicies", "listenersets", "referencegrants"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses/status", "gateways/status", "httproutes/status", "grpcroutes/status", "tcproutes/status", "tlsroutes/status", "udproutes/status", "backendtlspolicies/status", "listenersets/status"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: krouter-controlplane
  labels:
    app.kubernetes.io/name: krouter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: krouter-controlplane
subjects:
  - kind: ServiceAccount
    name: krouter-controlplane
    namespace: krouter-system
---
# Data-plane permissions (docs/spec/security.md): backend Services and EndpointSlices
# only. Cluster-wide read is granted instead of per-namespace
# RoleBindings; the data plane never reads source TLS Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: krouter-dataplane
  labels:
    app.kubernetes.io/name: krouter
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: krouter-dataplane
  labels:
    app.kubernetes.io/name: krouter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: krouter-dataplane
subjects:
  - kind: ServiceAccount
    name: krouter-dataplane
    namespace: krouter-system
---
# Controller-generated configuration and TLS material in krouter-system
# (docs/spec/architecture.md, docs/spec/security.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: krouter-dataplane-config
  namespace: krouter-system
  labels:
    app.kubernetes.io/name: krouter
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: krouter-dataplane-config
  namespace: krouter-system
  labels:
    app.kubernetes.io/name: krouter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: krouter-dataplane-config
subjects:
  - kind: ServiceAccount
    name: krouter-dataplane
    namespace: krouter-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krouter-controlplane
  namespace: krouter-system
  labels:
    app.kubernetes.io/name: krouter
    app.kubernetes.io/component: controlplane
spec:
  # Single replica, no leader election (docs/spec/architecture.md).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: krouter
      app.kubernetes.io/component: controlplane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krouter
        app.kubernetes.io/component: controlplane
    spec:
      serviceAccountName: krouter-controlplane
      # Keep generated <SERVICE>_PORT variables out of the environment:
      # they would collide with the KROUTER_* settings.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: krouter
          image: ghcr.io/link-society/krouter:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: KROUTER_MODE
              value: controlplane
            - name: KROUTER_CONTROLLER_NAME
              value: link-society.com/krouter
            - name: KROUTER_SYSTEM_NAMESPACE
              value: krouter-system
            - name: KROUTER_INTERNAL_PORT_MIN
              value: "10000"
            - name: KROUTER_INTERNAL_PORT_MAX
              value: "29999"
            - name: KROUTER_MANAGEMENT_PORT
              value: "9090"
            - name: KROUTER_DASHBOARD_PORT
              value: "8080"
            - name: KROUTER_LOG_LEVEL
              value: info
          ports:
            - name: mgmt
              containerPort: 9090
            - name: dashboard
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /livez
              port: mgmt
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: mgmt
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
# Control-plane dashboard: reach it with
#   kubectl -n krouter-system port-forward svc/krouter-dashboard 8080
apiVersion: v1
kind: Service
metadata:
  name: krouter-dashboard
  namespace: krouter-system
  labels:
    app.kubernetes.io/name: krouter
    app.kubernetes.io/component: controlplane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: krouter
    app.kubernetes.io/component: controlplane
  ports:
    - name: dashboard
      port: 8080
      targetPort: dashboard
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: krouter-dataplane
  namespace: krouter-system
  labels:
    app.kubernetes.io/name: krouter
    app.kubernetes.io/component: dataplane
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: krouter
      app.kubernetes.io/component: dataplane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krouter
        app.kubernetes.io/component: dataplane
    spec:
      serviceAccountName: krouter-dataplane
      # Keep generated <SERVICE>_PORT variables out of the environment:
      # they would collide with the KROUTER_* settings.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: krouter
          image: ghcr.io/link-society/krouter:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: KROUTER_MODE
              value: dataplane
            - name: KROUTER_SYSTEM_NAMESPACE
              value: krouter-system
            - name: KROUTER_MANAGEMENT_PORT
              value: "9090"
            - name: KROUTER_LOG_LEVEL
              value: info
          ports:
            - name: mgmt
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /livez
              port: mgmt
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: mgmt
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
