---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bench-route
spec:
  parentRefs:
    - name: bench-gw
  hostnames:
    - bench.example.com
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Bench-Generation
                value: reloaded
      backendRefs:
        - name: bench-backend
          port: 80
