---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: bench-backend
  template:
    metadata:
      labels:
        app: bench-backend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: bench-backend
spec:
  selector:
    app: bench-backend
  ports:
    - name: http
      port: 80
      targetPort: 80
