##############################
## CROSS-NAMESPACE BACKEND
##############################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  namespace: demo-backends
  labels:
    app.kubernetes.io/name: audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audit
          image: ghcr.io/link-society/krouter-mock-httpbin:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /hostname
              port: http
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
