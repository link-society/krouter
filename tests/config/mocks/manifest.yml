---
apiVersion: v1
kind: Service
metadata:
  name: audit
  namespace: demo-backends
spec:
  selector:
    app.kubernetes.io/name: audit
  ports:
    - name: http
      port: 9100
      targetPort: http
---
# Authorizes the audit backendRef and the RequestMirror target below
# (docs/spec/security.md).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-demo-routes
  namespace: demo-backends
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: demo
  to:
    - group: ""
      kind: Service
---
##############################
## ROUTES
##############################
# Extended-feature showcase: request timeout, URL rewrite, header
# modifiers, redirect, weighted canary and request mirroring
# (docs/spec/traffic.md).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: demo
spec:
  parentRefs:
    - name: demo
      sectionName: http
  hostnames:
    - httpbin.demo.example.com
  rules:
    # /delay/5 sleeps longer than the request timeout -> 504.
    - matches:
        - path:
            type: PathPrefix
            value: /delay
      timeouts:
        request: 2s
      backendRefs:
        - name: httpbin
          port: 80
    # /api/* is rewritten to /anything/* and tagged on both directions.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /anything
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Demo-Gateway
                value: krouter
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: X-Demo-Route
                value: httpbin
      backendRefs:
        - name: httpbin
          port: 80
    # /old/* answers with a 302 towards /anything/*.
    - matches:
        - path:
            type: PathPrefix
            value: /old
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /anything
            statusCode: 302
    # Catch-all: 90/10 canary split, mirrored to the audit backend.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: audit
              namespace: demo-backends
              port: 9100
      backendRefs:
        - name: httpbin
          port: 80
          weight: 90
        - name: httpbin-canary
          port: 80
          weight: 10
---
# Cross-namespace backend authorized by the ReferenceGrant above.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audit
  namespace: demo
spec:
  parentRefs:
    - name: demo
      sectionName: http
  hostnames:
    - httpbin.demo.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /audit
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: audit
          namespace: demo-backends
          port: 9100
---
# Intentionally missing backend: shows degraded rendering in the dashboard
# and 500s at runtime (docs/spec/failure-modes.md).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: missing
  namespace: demo
spec:
  parentRefs:
    - name: demo
      sectionName: http
  hostnames:
    - httpbin.demo.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /missing
      backendRefs:
        - name: missing
          port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpcbin
  namespace: demo
spec:
  parentRefs:
    - name: demo
      sectionName: http
  hostnames:
    - grpcbin.demo.example.com
  rules:
    - backendRefs:
        - name: grpcbin
          port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: tcpbin
  namespace: demo
spec:
  parentRefs:
    - name: demo
      sectionName: tcp
  rules:
    - backendRefs:
        - name: tcpbin
          port: 4242
---
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata:
  name: udpbin
  namespace: demo
spec:
  parentRefs:
    - name: demo
      sectionName: udp
  rules:
    - backendRefs:
        - name: udpbin
          port: 5354
---
# TLS passthrough: the SNI is matched by the gateway, the TLS stream is
# forwarded untouched to grpcbin's TLS listener.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: grpcbin-tls
  namespace: demo
spec:
  parentRefs:
    - name: demo
      sectionName: tls
  hostnames:
    - grpcbin.demo.example.com
  rules:
    - backendRefs:
        - name: grpcbin
          port: 9001
