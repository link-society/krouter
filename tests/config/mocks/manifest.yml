---
# Demo topology: one Gateway serving every route kind implemented by
# krouter — HTTP, gRPC, TCP, UDP and TLS passthrough — backed by the mock
# backends from tests/mocks (httpbin, tcpbin, udpbin, grpcbin; images built
# by `task mocks:build`), plus an LDAP-protected path backed by a GLAuth
# directory. `task k8s:serve` builds and loads the
# images, applies this manifest and port-forwards the dashboard.
#
# It also keeps the dashboard-degradation examples: a cross-namespace
# backend authorized by a ReferenceGrant, and one intentionally missing
# backend.
#
# The Gateway requests deterministic NodePorts through infrastructure
# parameters (docs/spec/parameters.md); the kind cluster publishes them on
# 127.0.0.1 (tests/config/kind/cluster.yaml, worker2 = port + 1000):
#
#   http 30098 — tcp 30099 — tls 30100
#
# Try it from the host:
#
#   # HTTP — httpbin: echo + round robin, rewrite + header filters,
#   # redirect, request timeout, 90/10 canary, cross-namespace, mirror
#   curl -s -H 'Host: httpbin.demo.example.com' http://127.0.0.1:30098/hostname
#   curl -s -H 'Host: httpbin.demo.example.com' http://127.0.0.1:30098/api/echo
#   curl -sI -H 'Host: httpbin.demo.example.com' http://127.0.0.1:30098/old
#   curl -s -H 'Host: httpbin.demo.example.com' http://127.0.0.1:30098/delay/5   # 504 after 2s
#   curl -s -H 'Host: httpbin.demo.example.com' http://127.0.0.1:30098/audit/headers
#   curl -s -H 'Host: httpbin.demo.example.com' http://127.0.0.1:30098/missing   # intentionally degraded
#
#   # gRPC — grpcbin (server reflection enabled):
#   grpcurl -plaintext -authority grpcbin.demo.example.com 127.0.0.1:30098 list
#   grpcurl -plaintext -authority grpcbin.demo.example.com \
#     -d '{"name": "krouter"}' 127.0.0.1:30098 helloworld.Greeter/SayHello
#
#   # TCP — tcpbin (hostname greeting, then echo):
#   nc 127.0.0.1 30099
#
#   # TLS passthrough — grpcbin's TLS listener, routed by SNI:
#   grpcurl -insecure -servername grpcbin.demo.example.com 127.0.0.1:30100 list
#
#   # Authentication — LDAP-protected paths (docs/spec/authentication.md;
#   # alice/alice-password is in platform-team, bob/bob-password in
#   # contractors, /admin requires platform-team):
#   curl -si -H 'Host: httpbin.demo.example.com' http://127.0.0.1:30098/private   # 401 + Basic challenge
#   curl -s -u alice:alice-password -H 'Host: httpbin.demo.example.com' \
#     http://127.0.0.1:30098/private                                              # X-Auth-Request-* headers
#   curl -si -u bob:bob-password -H 'Host: httpbin.demo.example.com' \
#     http://127.0.0.1:30098/admin                                                # 403, wrong group
#
#   # Browser flow (login form, session cookie, logout): add
#   #   127.0.0.1 httpbin.demo.example.com
#   # to /etc/hosts, then open http://httpbin.demo.example.com:30098/private
#   # and http://httpbin.demo.example.com:30098/.krouter/auth/logout
#
#   # UDP — udpbin (NodePort left dynamic: the kind cluster publishes no
#   # spare UDP host port, so probe from inside the cluster):
#   GW_SVC=$(kubectl -n demo get svc -l app.kubernetes.io/managed-by=krouter \
#     -o jsonpath='{.items[0].metadata.name}')
#   kubectl -n demo run udp-probe --rm -i --restart=Never --image=busybox:1.36 \
#     -- sh -c "echo ping | nc -u -w2 $GW_SVC 5354"
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-backends
---
# Same object as tests/config/conformance/gatewayclass.yaml — applying both
# is idempotent.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: krouter
spec:
  controllerName: link-society.com/krouter
---
# Deterministic NodePorts for the host-published window (the udp listener
# is deliberately absent: its NodePort stays dynamic).
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-gateway-params
  namespace: demo
data:
  krouter.hcl: |
    version = 1

    service {
      type                    = "NodePort"
      external_traffic_policy = "Local"

      node_ports = {
        "http" = 30098
        "tcp"  = 30099
        "tls"  = 30100
      }
    }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo
  namespace: demo
spec:
  gatewayClassName: krouter
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: demo-gateway-params
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: tcp
      protocol: TCP
      port: 4242
      allowedRoutes:
        namespaces:
          from: Same
    - name: udp
      protocol: UDP
      port: 5354
      allowedRoutes:
        namespaces:
          from: Same
    - name: tls
      protocol: TLS
      port: 443
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
---
##############################
## HTTPBIN (HTTP echo)
##############################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: demo
  labels:
    app.kubernetes.io/name: httpbin
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: httpbin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: httpbin
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: httpbin
          image: ghcr.io/link-society/krouter-mock-httpbin:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /hostname
              port: http
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: demo
spec:
  selector:
    app.kubernetes.io/name: httpbin
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Canary target for the 90/10 weighted split on the catch-all rule.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-canary
  namespace: demo
  labels:
    app.kubernetes.io/name: httpbin-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: httpbin-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: httpbin-canary
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: httpbin
          image: ghcr.io/link-society/krouter-mock-httpbin:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /hostname
              port: http
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-canary
  namespace: demo
spec:
  selector:
    app.kubernetes.io/name: httpbin-canary
  ports:
    - name: http
      port: 80
      targetPort: http
---
