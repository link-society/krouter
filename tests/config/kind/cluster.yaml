      - { containerPort: 30094, hostPort: 30094, listenAddress: 127.0.0.1 }
      - { containerPort: 30095, hostPort: 30095, listenAddress: 127.0.0.1 }
      - { containerPort: 30096, hostPort: 30096, listenAddress: 127.0.0.1 }
      - { containerPort: 30097, hostPort: 30097, listenAddress: 127.0.0.1, protocol: UDP }
      - { containerPort: 30098, hostPort: 30098, listenAddress: 127.0.0.1 }
      - { containerPort: 30099, hostPort: 30099, listenAddress: 127.0.0.1 }
      - { containerPort: 30100, hostPort: 30100, listenAddress: 127.0.0.1 }
      - { containerPort: 30443, hostPort: 30443, listenAddress: 127.0.0.1 }
      - { containerPort: 30444, hostPort: 30444, listenAddress: 127.0.0.1 }
      - { containerPort: 30445, hostPort: 30445, listenAddress: 127.0.0.1 }
  - role: worker
    extraPortMappings:
