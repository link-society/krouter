---
# In-cluster runner for the official Gateway API conformance suite
# (docs/spec/acceptance.md criterion 1). The suite dials the addresses
# published on Gateway status, which are cluster-internal, so it must
# execute inside the cluster. `task tests:conformance` copies the compiled
# test binary into this pod, runs it, and retrieves the report.
apiVersion: v1
kind: Namespace
metadata:
  name: krouter-conformance
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conformance-runner
  namespace: krouter-conformance
---
# The suite provisions namespaces, backends, Gateways, routes and CRD-level
# checks on the fly; upstream runs it with cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: krouter-conformance-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: conformance-runner
    namespace: krouter-conformance
---
apiVersion: v1
kind: Pod
metadata:
  name: conformance-runner
  namespace: krouter-conformance
spec:
  serviceAccountName: conformance-runner
  containers:
    - name: runner
      image: busybox:1.36
      command: ["sleep", "infinity"]
      workingDir: /work
      volumeMounts:
        - name: work
          mountPath: /work
  volumes:
    - name: work
      emptyDir: {}
