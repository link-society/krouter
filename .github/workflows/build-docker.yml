---
name: build-docker

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: cache@image
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: image.tar
          key: docker-image-${{ inputs.ref }}

      - name: checkout@scm
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: setup@docker
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build@docker
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/krouter.dockerfile
          tags: ghcr.io/link-society/krouter:dev
          push: false
          load: true
          cache-from: type=gha,scope=krouter-linux-amd64
          cache-to: type=gha,mode=max,scope=krouter-linux-amd64

      - name: save@image
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker save ghcr.io/link-society/krouter:dev -o image.tar

      - name: upload@artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-${{ inputs.ref }}
          path: image.tar
          retention-days: 1
          compression-level: 0
