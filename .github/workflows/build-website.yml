---
name: build-website

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: checkout@scm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: setup@toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          testsuite: "true"

      - name: setup@hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: latest
          extended: true

      - name: download@test-results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*
          path: tests/results/
          merge-multiple: true

      # The suites already enforced their own verdicts; here the aggregation
      # only renders whatever JUnit files the triggering pipeline produced.
      - name: aggregate@report
        run: task tests:report:build || true

      # PR pipelines run a subset of the suites; keep the website build
      # honest about it instead of failing the hugo precondition.
      - name: placeholder@report
        run: task www:report:placeholder

      - name: build@website
        run: task www:build

      - name: upload@artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-${{ inputs.ref }}
          path: website/public/
          retention-days: 7
