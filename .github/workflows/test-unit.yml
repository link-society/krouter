---
name: test-unit

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  unit:
    runs-on: self-hosted
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: checkout@scm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: setup@toolchain
        uses: ./.github/actions/setup-toolchain

      - name: vet@go
        run: task tests:vet

      - name: run@testsuite
        run: task tests:unit:junit

      - name: report@testsuite
        if: ${{ !cancelled() }}
        uses: ./.github/actions/publish-test-report
        with:
          suite: unit
          checkname: Unit Test Report
