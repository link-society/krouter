---
name: ci-release

on:
  release:
    types:
      - published

jobs:
  release-docker:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout@scm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: setup@qemu
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: setup@docker
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: login@ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: publish@docker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/krouter.dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/link-society/krouter:${{ github.event.release.tag_name }}
            ghcr.io/link-society/krouter:latest
          push: true
          cache-from: type=gha,scope=krouter-release
          cache-to: type=gha,mode=max,scope=krouter-release
