---
name: ci-release

on:
  release:
    types:
      - published

jobs:
  release-docker:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout@scm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: setup@qemu
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: setup@docker
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: login@ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: publish@docker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/krouter.dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/link-society/krouter:${{ github.event.release.tag_name }}
            ghcr.io/link-society/krouter:latest
          push: true
          cache-from: type=gha,scope=krouter-release
          cache-to: type=gha,mode=max,scope=krouter-release
