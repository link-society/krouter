---
name: ci-release

on:
  release:
    types:
      - published

jobs:
  release-docker:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout@scm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: setup@qemu
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: setup@docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: login@ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: publish@docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/krouter.dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/link-society/krouter:${{ github.event.release.tag_name }}
            ghcr.io/link-society/krouter:latest
          push: true
          cache-from: type=gha,scope=krouter-release
          cache-to: type=gha,mode=max,scope=krouter-release
