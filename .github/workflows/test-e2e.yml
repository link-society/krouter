---
name: test-e2e

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: checkout@scm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: setup@toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          testsuite: "true"

      - name: setup@cluster
        uses: ./.github/actions/setup-cluster
        with:
          ref: ${{ inputs.ref }}

      - name: load@mocks
        run: task mocks:load

      - name: run@testsuite
        run: task tests:e2e:junit

      - name: report@testsuite
        if: ${{ !cancelled() }}
        uses: ./.github/actions/publish-test-report
        with:
          suite: e2e
          checkname: End-To-End Test Report

      - name: cleanup@cluster
        if: ${{ always() }}
        run: task k8s:down
